<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GPU Pricing</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="page">
      <header>
        <h1>GPU Pricing</h1>
        <span id="count" class="count"></span>
      </header>
      <div class="filters">
        <select id="gpuFilter" aria-label="GPU">
          <option value="">All GPUs</option>
          <option value="H100" selected>H100</option>
        </select>
        <select id="regionFilter" aria-label="Region">
          <option value="">All regions</option>
        </select>
        <input id="maxPriceFilter" type="number" min="0" step="0.01" placeholder="Max $/GPU/hr" inputmode="decimal">
        <select id="providerFilter" aria-label="Provider">
          <option value="">All providers</option>
        </select>
        <label class="check" for="orderableOnly">
          <input id="orderableOnly" type="checkbox">
          Orderable
        </label>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>
                <button type="button" data-sort="provider">Provider<span class="arrow" aria-hidden="true"></span></button>
              </th>
              <th class="tight">
                <button type="button" data-sort="configuration">Configuration<span class="arrow" aria-hidden="true"></span></button>
              </th>
              <th>
                <button type="button" data-sort="region">Region<span class="arrow" aria-hidden="true"></span></button>
              </th>
              <th class="num tight">
                <button type="button" data-sort="pricePerGpuHour" aria-sort="ascending"><span class="arrow" aria-hidden="true">↑</span>$/GPU/hr</button>
              </th>
              <th class="num tight">
                <button type="button" data-sort="totalHourlyPrice"><span class="arrow" aria-hidden="true"></span>$/hr</button>
              </th>
              <th class="num">
                <button type="button" data-sort="availability"><span class="arrow" aria-hidden="true"></span>Avail</button>
              </th>
              <th class="order"><span class="order-label">Order</span></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
